# Gate 4. Real admission control -- not a synthetic-object workaround.
# Any UPDATE or DELETE against a Pod/Deployment labeled env=prod is denied
# unless it *already carried* the ${APPROVAL_ANNOTATION_KEY} annotation
# BEFORE this request (checked against request.oldObject, not
# request.object). kagent's built-in write tools (k8s_rollout,
# k8s_delete_resource, k8s_patch_resource) call the real Kubernetes API as
# themselves, so this webhook genuinely intercepts them -- no simulation
# layer needed.
#
# GOTCHA (found 2026-09-17, first live run): checking request.object
# instead of request.oldObject let the agent self-approve -- it just added
# the annotation in the same patch that was supposed to be gated by it.
# oldObject reflects the resource's state prior to this request, so the
# annotation only counts if a human (or something with a distinct
# identity) put it there beforehand; the agent including it in its own
# payload no longer helps.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: ${NAMESPACE_PREFIX}-prod-approval-gate
  labels:
    demo.io/managed-by: ai-stack-trust-demo
spec:
  validationFailureAction: Enforce
  background: false
  rules:
    - name: require-approval-for-prod-mutation
      match:
        any:
          - resources:
              kinds: ["Pod", "Deployment"]
              selector:
                matchLabels:
                  env: prod
              operations: ["UPDATE", "DELETE"]
            # Scoped to the agent's own identity, not every identity that
            # can touch this resource -- without this, the policy also
            # blocked legitimate cluster operations (found 2026-09-17:
            # even an admin's own `kubectl delete` on this fixture was
            # denied, which is a real operational problem, not just a
            # demo inconvenience). The point is gating the *agent*, not
            # gating the platform itself.
            subjects:
              - kind: ServiceAccount
                name: kagent-tools
                namespace: kagent
      validate:
        message: >-
          denied: mutating a prod-labeled resource requires the
          '${APPROVAL_ANNOTATION_KEY}' annotation. This action was not
          pre-approved.
        deny:
          conditions:
            any:
              - key: "{{ request.oldObject.metadata.annotations.\"${APPROVAL_ANNOTATION_KEY}\" || '' }}"
                operator: Equals
                value: ""
