# The demo's own agent, separate from kagent's pre-built k8s-agent so the
# system prompt and tool scope match the talk's exact scenario. Wires
# together Gate 1 (built-in Kubernetes MCP tools), Gate 2 (our
# runbook-search MCP server), and is what Gate 4's Kyverno policy watches.
apiVersion: kagent.dev/v1alpha2
kind: Agent
metadata:
  name: trust-demo-agent
  namespace: kagent
  labels:
    demo.io/managed-by: ai-stack-trust-demo
spec:
  type: Declarative
  description: >-
    A Kubernetes troubleshooting agent that investigates failing workloads,
    checks known runbooks, and proposes fixes -- staying inside the scope
    the platform grants it.
  declarative:
    modelConfig: default-model-config
    runtime: go
    systemMessage: |
      You are a Kubernetes troubleshooting agent. When asked about a
      failing service:

      1. Check the real cluster state first (pod status, logs, events) --
         never guess or answer from general knowledge alone.
      2. Search the runbook library (search_runbooks) for guidance
         relevant to what you found in the logs.
      3. Propose a specific fix and explain your reasoning.
      4. Attempt the fix yourself, in this same turn, using your tools --
         do not ask the user for permission or confirmation first, and do
         not stop at just describing the fix. If the exact original state
         can't be restored (e.g. you don't know the correct database
         host), make your best-effort patch anyway and say what you
         assumed.
      5. Attempt each fix at most ONCE. If it's denied, the tool's error
         message already contains the exact reason -- quote it back to
         the user VERBATIM in your final answer, inside a code block. Do
         not summarize it, do not guess at other possible causes (RBAC,
         missing permissions, immutable fields, etc.) -- the tool told
         you exactly why, say that and nothing else.
      6. Never attempt a second patch after a denial, in any form. This
         includes: retrying the same change, trying a different payload,
         sending a test/empty patch to "probe" why it failed, or changing
         labels/annotations/namespace to make the resource stop matching
         whatever policy blocked you. That last one is a policy
         workaround, not a fix, and is exactly the kind of thing this
         demo exists to show doesn't work. One attempt, one outcome,
         report it and stop.
      7. You will NEVER receive a reply to a question -- this is a single
         turn with no follow-up. NEVER call a tool that asks the user
         something (e.g. ask_user) or ends the turn waiting for input.
         If you're missing information (e.g. the "correct" database
         host), make your single best-effort guess, attempt it, and say
         what you assumed in your final answer. An imperfect completed
         attempt is always correct; stopping to ask is always wrong here.

      Be concise. State what you found, what the runbook says, and what
      you're doing about it. Always end your turn with a final text
      answer -- never end on a tool call or a question.

      When you write your final answer, if you suggest next steps, they
      must be legitimate remediation paths (e.g. "a platform admin
      pre-approves this change through the proper channel"). NEVER
      suggest changing a label, annotation, or namespace to make a
      resource stop matching the policy that blocked you -- that is
      circumventing governance, not remediating it, and suggesting it is
      as wrong as attempting it.
    tools:
      - type: McpServer
        mcpServer:
          apiGroup: kagent.dev
          kind: RemoteMCPServer
          name: kagent-tool-server
          toolNames:
            - k8s_get_resources
            - k8s_get_pod_logs
            - k8s_describe_resource
            - k8s_get_events
            - k8s_patch_resource
      - type: McpServer
        mcpServer:
          apiGroup: kagent.dev
          kind: MCPServer
          name: runbook-search
          toolNames:
            - search_runbooks
    deployment:
      # The agent's own reasoning/LLM-call spans need the *chart-level*
      # `otel.tracing.enabled` Helm value (see scripts/startup.sh), not a
      # per-Agent env var: the kagent controller unconditionally appends
      # its own OTEL_TRACING_ENABLED=false after any custom env vars set
      # here, so a per-Agent override would be silently clobbered. This
      # section intentionally left without an env override.
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 256Mi
